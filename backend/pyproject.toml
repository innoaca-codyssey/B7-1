[project]
name = "b7-1-chatbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic-settings>=2.11",
    "openai>=3.26.0",
    "sqlalchemy>=2.1.3",
    "psycopg[binary]>=3.3.6",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
