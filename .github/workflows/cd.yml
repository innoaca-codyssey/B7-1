name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - env:
          CD_SSH_KEY: ${{ secrets.CD_SSH_KEY }}
          CD_KNOWN_HOSTS: ${{ secrets.CD_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$CD_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$CD_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - env:
          CD_HOST: ${{ secrets.CD_HOST }}
          CD_PORT: ${{ secrets.CD_PORT }}
          CD_USER: ${{ secrets.CD_USER }}
        run: ssh -i ~/.ssh/deploy_key -p "$CD_PORT" -o StrictHostKeyChecking=yes "$CD_USER@$CD_HOST"
